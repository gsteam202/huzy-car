      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="carDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
